name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Install dependencies
        working-directory: android-app
        run: npm install --legacy-peer-deps

      - name: Prebuild Android native project
        working-directory: android-app
        run: npx expo prebuild --platform android --no-install

      - name: Patch Kotlin version compatibility
        working-directory: android-app/android
        run: |
          # Add suppressKotlinVersionCompatibilityCheck to composeOptions in app/build.gradle
          # This resolves the Compose Compiler 1.5.15 / Kotlin 1.9.24 incompatibility
          sed -i '/composeOptions {/a\        suppressKotlinVersionCompatibilityCheck = true' app/build.gradle || true
          
          # Also patch the root build.gradle to use Kotlin 1.9.25
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.25"/g' build.gradle || true
          sed -i 's/"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"/"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"/g' build.gradle || true
          
          echo "=== Patched build.gradle files ==="
          grep -n "suppressKotlinVersion\|kotlinVersion\|kotlin-gradle-plugin" app/build.gradle build.gradle 2>/dev/null || echo "(no matches found)"

      - name: Build APK with Gradle
        working-directory: android-app/android
        run: ./gradlew assembleRelease -x lintRelease -x lintDebug --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"'

      - name: Find and rename APK
        run: |
          mkdir -p release
          APK_PATH=$(find android-app/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "Found APK: $APK_PATH"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release/gold-rsi-widget-${{ github.ref_name }}.apk
            ls -la release/
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-rsi-widget-apk
          path: release/*.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          name: Gold RSI Widget ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            # Gold RSI Widget — Android APK

            ## Download

            Download the APK file below (`gold-rsi-widget-*.apk`) and install on your Android device.

            **Note:** You may need to enable **"Install from unknown sources"** in your Android settings to install this APK.

            ## Features

            - Live gold price (XAUUSD) + RSI(30) on M30 timeframe
            - Prediction of market reaction (reversal / divergence / pass-through)
            - Important zones from daily & weekly Doji candles
            - M5 candlestick pattern detection (doji, pin bar, hammer, engulfing)
            - Entry ticket with stop loss / take profit
            - Persian RTL interface with pastel color theme

            ## Data Sources

            - Live price: TradingView TVC:GOLD
            - Historical candles: Yahoo Finance GC=F
            - Fallback: Binance PAXG/USDT

            ## Installation

            1. Download the `.apk` file from this release
            2. Open it on your Android device
            3. Allow installation from unknown sources if prompted
            4. Install and open the app

            ---
            Built automatically by GitHub Actions from commit ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
