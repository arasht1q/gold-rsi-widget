name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Install dependencies
        working-directory: android-app
        run: npm install --legacy-peer-deps

      - name: Prebuild Android native project
        working-directory: android-app
        run: npx expo prebuild --platform android --no-install

      - name: Patch Kotlin version compatibility
        working-directory: android-app/android
        run: |
          echo "=== Before patch ==="
          grep -i kotlin gradle.properties || echo "(no kotlin in gradle.properties)"
          echo "---"
          
          # 1. Force Kotlin 1.9.25 in gradle.properties
          if grep -q "android.kotlinVersion" gradle.properties; then
            sed -i 's/android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' gradle.properties
          else
            echo "android.kotlinVersion=1.9.25" >> gradle.properties
          fi
          
          # 2. Patch kotlinVersion default in root build.gradle (replace any 1.9.24 with 1.9.25)
          sed -i 's/1\.9\.24/1.9.25/g' build.gradle
          
          # 3. Add suppressKotlinVersionCompatibilityCheck to app/build.gradle
          #    Use Python to safely modify the file (avoids sed escaping issues)
          python3 << 'PYEOF'
          import re
          with open('app/build.gradle', 'r') as f:
              content = f.read()
          
          if 'composeOptions' not in content:
              # Add composeOptions block after 'android {' line
              content = content.replace(
                  'android {',
                  'android {\n    composeOptions {\n        suppressKotlinVersionCompatibilityCheck = true\n    }',
                  1
              )
          elif 'suppressKotlinVersionCompatibilityCheck' not in content:
              # Add inside existing composeOptions
              content = content.replace(
                  'composeOptions {',
                  'composeOptions {\n        suppressKotlinVersionCompatibilityCheck = true',
                  1
              )
          
          with open('app/build.gradle', 'w') as f:
              f.write(content)
          print("✓ Patched app/build.gradle")
          PYEOF
          
          echo "=== After patch ==="
          echo "--- gradle.properties ---"
          grep -i kotlin gradle.properties
          echo "--- build.gradle ---"
          grep "kotlinVersion" build.gradle | head -3
          echo "--- app/build.gradle compose ---"
          grep -A 2 "composeOptions" app/build.gradle | head -5

      - name: Build APK with Gradle
        working-directory: android-app/android
        run: ./gradlew assembleRelease -x lintRelease -x lintDebug --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"'

      - name: Find and rename APK
        run: |
          mkdir -p release
          APK_PATH=$(find android-app/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "Found APK: $APK_PATH"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release/gold-rsi-widget-${{ github.ref_name }}.apk
            ls -la release/
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-rsi-widget-apk
          path: release/*.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          name: Gold RSI Widget ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            # Gold RSI Widget — Android APK

            ## Download

            Download the APK file below (`gold-rsi-widget-*.apk`) and install on your Android device.

            **Note:** You may need to enable **"Install from unknown sources"** in your Android settings to install this APK.

            ## Features

            - Live gold price (XAUUSD) + RSI(30) on M30 timeframe
            - Prediction of market reaction (reversal / divergence / pass-through)
            - Important zones from daily & weekly Doji candles
            - M5 candlestick pattern detection (doji, pin bar, hammer, engulfing)
            - Entry ticket with stop loss / take profit
            - Persian RTL interface with pastel color theme

            ## Data Sources

            - Live price: TradingView TVC:GOLD
            - Historical candles: Yahoo Finance GC=F
            - Fallback: Binance PAXG/USDT

            ## Installation

            1. Download the `.apk` file from this release
            2. Open it on your Android device
            3. Allow installation from unknown sources if prompted
            4. Install and open the app

            ---
            Built automatically by GitHub Actions from commit ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
